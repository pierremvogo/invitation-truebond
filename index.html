
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Invitation TRUEBOND</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f0ea;
      font-family: Arial, sans-serif;
      color: #29232f;
    }

    .card {
      background: white;
      padding: 32px;
      margin: 20px;
      max-width: 420px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    h1 {
      color: #7944b0;
    }

    p {
      line-height: 1.6;
    }

    .notice {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>TRUEBOND</h1>
    <h2>Vous avez reçu une invitation</h2>

    <p>
      Ouvrez ce lien sur votre téléphone
      avec l'application TRUEBOND installée
      pour consulter votre invitation.
    </p>

    <p class="notice" id="message">
      Vérification du lien...
    </p>
  </main>

  <script>
    const params = new URLSearchParams(
      window.location.search
    );

    const token = params.get("token");

    const validToken =
      token !== null &&
      /^[A-Za-z0-9_-]{43}$/.test(token);

    document.getElementById("message").textContent =
      validToken
        ? "Si TRUEBOND ne s'ouvre pas automatiquement, " +
          "vérifiez que l'application est installée."
        : "Ce lien d'invitation est incomplet ou invalide.";
  </script>
</body>
</html>
